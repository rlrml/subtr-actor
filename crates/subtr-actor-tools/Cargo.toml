[package]
name = "subtr-actor-tools"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Ad-hoc diagnostics and Ballchasing comparison tooling for subtr-actor development"

[dependencies]
anyhow = "1.0.98"
boxcars.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
float-ord = "0.3.2"
glam = "0.31.0"
ndarray = "0.17.2"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
subtr-actor = { path = "../.." }
subtr-actor-training = { path = "../subtr-actor-training" }
