[project]
name = "subtr-actor-whiff-model"
version = "0.1.0"
description = "Vision-assisted whiff labeling, telemetry training, and evaluation for subtr-actor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
